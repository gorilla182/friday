name: Deploy to Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "vercel-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm run build
          npm test -- --run

  deploy-preview:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy from root; vercel.json has outputDirectory: "site" so site/ contents become the root
          # For PR previews we don't need to scope to a specific project (no IDs)
          vercel deploy --yes

  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy from root; vercel.json has outputDirectory: "site"
          # Only set the scoped IDs if BOTH are provided.
          if [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            export VERCEL_ORG_ID="${{ secrets.VERCEL_ORG_ID }}"
            export VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          elif [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::VERCEL_PROJECT_ID is set, but VERCEL_ORG_ID is missing."
            echo "You need both to target a specific project."
            echo "On Hobby: use 'vercel link' locally to get orgId from .vercel/project.json as VERCEL_ORG_ID"
            exit 1
          fi

          vercel deploy --prod --yes

