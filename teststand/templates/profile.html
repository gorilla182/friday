{% extends "base.html" %}

{% block title %}Profile — Teststand{% endblock %}

{% block content %}
<section data-testid="profile-page">
    <h1 data-testid="profile-heading">Your profile</h1>

    <dl class="profile-details" data-testid="profile-details">
        <dt>Name</dt>
        <dd data-testid="profile-name">{{ user.name }}</dd>

        <dt>Email</dt>
        <dd data-testid="profile-email">{{ user.email }}</dd>

        <dt>Member since</dt>
        <dd data-testid="profile-created">{{ user.created_at }}</dd>

        <dt>Orders placed</dt>
        <dd data-testid="profile-order-count">{{ order_count }}</dd>
    </dl>

    <form method="post" action="{{ url_for('ui.logout') }}" data-testid="logout-form">
        <button type="submit" class="btn-danger" data-testid="logout-submit">Log out</button>
    </form>
</section>
{% endblock %}
