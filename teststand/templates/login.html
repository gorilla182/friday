{% extends "base.html" %}

{% block title %}Login — Teststand{% endblock %}

{% block content %}
<section class="auth-card" data-testid="login-page">
    <h1 data-testid="login-heading">Sign in</h1>

    {% if error %}
    <div class="error-box" data-testid="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('ui.login') }}" data-testid="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}"
               required data-testid="login-email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required data-testid="login-password">

        <button type="submit" data-testid="login-submit">Sign in</button>
    </form>

    <p class="auth-link">
        No account?
        <a href="{{ url_for('ui.register') }}" data-testid="login-register-link">Register</a>
    </p>
</section>
{% endblock %}
