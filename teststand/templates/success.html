{% extends "base.html" %}

{% block title %}Order placed — Teststand{% endblock %}

{% block content %}
<section class="success-card" data-testid="success-page">
    <h1 data-testid="success-heading">Order placed successfully!</h1>
    <p data-testid="success-message">Thank you for your order.</p>
    <p class="order-number" data-testid="order-number">Order number: <strong>{{ order_number }}</strong></p>
    <a href="{{ url_for('ui.dashboard') }}" class="btn" data-testid="success-continue">Continue shopping</a>
</section>
{% endblock %}
