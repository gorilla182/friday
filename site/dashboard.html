<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд — QA Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/supabase-data.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/layout.js"></script>
<script src="js/store.js"></script>
</head>
<body data-page="dashboard">

<div id="app-root"></div>

<script>
window.initAuthenticatedPage('dashboard', 'Дашборд', async ({ client, user, currentUser }) => {
  const products = await window.loadProducts(client);
  window.PRODUCTS = products;

  // Load cart data early for stats and to decide button vs stepper
  const cartData = await window.loadCart(client, user.id);
  let cartCount = 0;
  let cartTotal = 0;
  Object.entries(cartData).forEach(([pid, qty]) => {
    cartCount += qty;
    const p = products.find(pp => pp.id === pid);
    if (p) cartTotal += p.price * qty;
  });

  // populate Store + badge BEFORE mount
  window.populateStoreFromCart(cartData);

  const apiItemsCount = (await window.loadApiItems(client, user.id)).length;

  const main = document.getElementById('main-content');

  main.innerHTML = `
    <div class="page-head">
      <div>
        <span class="page-eyebrow">Обзор</span>
        <h1 class="page-title" data-testid="page-title">Добро пожаловать, ${currentUser.name.split(' ')[0]}</h1>
        <p class="page-sub">Сводка по магазину и товарам, доступным для заказа</p>
      </div>
      <a href="catalog.html" class="btn btn-secondary" data-testid="view-catalog-button">
        Весь каталог
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="stat-grid" data-testid="stat-grid">
      <div class="stat-card" data-testid="stat-card-cart-items">
        <span class="stat-label">В корзине</span>
        <span class="stat-value" data-testid="stat-cart-count">${cartCount}</span>
        <span class="stat-delta" data-testid="stat-cart-total">$${cartTotal.toFixed(2)}</span>
      </div>
      <div class="stat-card" data-testid="stat-card-products">
        <span class="stat-label">Товаров в каталоге</span>
        <span class="stat-value" data-testid="stat-products-total">${products.length}</span>
        <span class="stat-delta up">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          ${products.length} в наличии
        </span>
      </div>
      <div class="stat-card" data-testid="stat-card-out-of-stock">
        <span class="stat-label">Нет в наличии</span>
        <span class="stat-value" data-testid="stat-out-of-stock-count">0</span>
        <span class="stat-delta down">требует поставки</span>
      </div>
      <div class="stat-card" data-testid="stat-card-api-items">
        <span class="stat-label">My API Items</span>
        <span class="stat-value" data-testid="stat-api-items-count">${apiItemsCount}</span>
        <span class="stat-delta"><a href="profile.html#api-items" class="section-link" style="font-size:11px">смотреть →</a></span>
      </div>
    </div>

    <div class="section-head">
      <h2>Рекомендуемые товары</h2>
      <a href="catalog.html" class="section-link" data-testid="dashboard-catalog-link">
        Открыть каталог
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="product-grid" id="dashboard-product-grid" data-testid="dashboard-product-grid"></div>
  `;

  // render featured using shared renderer (respects current cart state from early load)
  const grid = document.getElementById('dashboard-product-grid');
  const featured = products.slice(0, 6);
  const currentCart = window.Store.getCart();
  grid.innerHTML = featured.map(p => window.renderProductCard(p, currentCart[p.id] || 0)).join('');

  // helper to refresh cart stats widgets (used by handlers + can call post checkout etc)
  async function updateCartStats() {
    const cartData = await window.loadCart(client, user.id);
    let cartCount = 0;
    let cartTotal = 0;
    Object.entries(cartData).forEach(([pid, qty]) => {
      cartCount += qty;
      const p = products.find(pp => pp.id === pid);
      if (p) cartTotal += p.price * qty;
    });
    const countEl = document.querySelector('[data-testid="stat-cart-count"]');
    const totalEl = document.querySelector('[data-testid="stat-cart-total"]');
    if (countEl) countEl.textContent = cartCount;
    if (totalEl) totalEl.textContent = '$' + cartTotal.toFixed(2);
    // keep Store in sync too
    window.populateStoreFromCart(cartData);
  }

  window.attachProductGridHandlers(grid, client, user, products, updateCartStats);
});
</script>
</body>
</html>
