<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Teststand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <header class="header" data-testid="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo" data-testid="site-logo">Teststand</a>
      <nav class="nav" data-testid="main-nav">
        <a href="dashboard.html" data-testid="nav-dashboard">Dashboard</a>
        <a href="cart.html" data-testid="nav-cart">Cart</a>
        <a href="profile.html" data-testid="nav-profile">Profile</a>
        <a href="my-items.html" data-testid="nav-my-items">My API Items</a>
        <button id="logout-btn" data-testid="logout-submit" class="btn-danger">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container main">
    <section data-testid="dashboard-page">
      <div class="page-header">
        <h1 data-testid="dashboard-heading">Product catalog</h1>
        <p class="muted" id="welcome" data-testid="dashboard-welcome"></p>
      </div>

      <!-- New: Search and filters for better test coverage -->
      <div class="filters" data-testid="dashboard-filters">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search products..." 
          data-testid="search-input"
          style="margin-right: 10px; padding: 8px;"
        >
        <select id="sort-select" data-testid="sort-select" style="padding: 8px; margin-right: 10px;">
          <option value="name-asc">Name A-Z</option>
          <option value="name-desc">Name Z-A</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
        <select id="category-select" data-testid="category-select" style="padding: 8px; margin-right: 10px;">
          <option value="">All Categories</option>
          <option value="programming">Programming</option>
          <option value="testing">Testing</option>
        </select>
        <button id="clear-filters" data-testid="clear-filters-btn" style="padding: 8px;">Clear</button>
      </div>

      <div class="product-grid" data-testid="product-list" id="product-list">
        <!-- Products loaded via JS -->
      </div>
    </section>
  </main>

  <footer class="footer" data-testid="site-footer">
    <div class="container">
      <p>Teststand — training app for automated testing</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    const client = window.createSupabaseClient();
    let allProducts = [];

    async function loadDashboard() {
      const user = await window.requireAuth(client);
      if (!user) return;

      const { data: { user: freshUser } } = await client.auth.getUser();
      const name = freshUser?.user_metadata?.name || freshUser?.email?.split('@')[0] || 'User';
      document.getElementById('welcome').textContent = `Welcome, ${name}!`;

      const { data: products, error } = await client
        .from('products')
        .select('*')
        .order('id');

      const container = document.getElementById('product-list');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p data-testid="empty-products">Error loading products.</p>`;
        return;
      }

      allProducts = products || [];

      if (allProducts.length === 0) {
        container.innerHTML = `<p data-testid="empty-products">No products available.</p>`;
        return;
      }

      renderProducts(allProducts);

      // Setup filters (new)
      setupFilters();
    }

    function renderProducts(products) {
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      products.forEach(product => {
        const article = document.createElement('article');
        article.className = 'product-card';
        article.setAttribute('data-testid', `product-card-${product.id}`);

        article.innerHTML = `
          <h2 data-testid="product-name-${product.id}">${product.name}</h2>
          <p class="price" data-testid="product-price-${product.id}">$${product.price.toFixed(2)}</p>
          <p class="description">${product.description}</p>
          <a href="item_detail.html?id=${product.id}" 
             class="btn btn-secondary" 
             data-testid="product-view-${product.id}">View details</a>
        `;
        container.appendChild(article);
      });
    }

    function setupFilters() {
      const searchInput = document.getElementById('search-input');
      const sortSelect = document.getElementById('sort-select');
      const categorySelect = document.getElementById('category-select');
      const clearBtn = document.getElementById('clear-filters');

      // Populate categories dynamically from products
      const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
      categorySelect.innerHTML = '<option value="">All Categories</option>';
      categories.forEach((cat: string) => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        categorySelect.appendChild(opt);
      });

      const filterAndRender = () => {
        let filtered = [...allProducts];

        // Search by name
        const searchTerm = searchInput.value.toLowerCase().trim();
        if (searchTerm) {
          filtered = filtered.filter((p: any) => 
            p.name.toLowerCase().includes(searchTerm) || 
            (p.description && p.description.toLowerCase().includes(searchTerm))
          );
        }

        // Category filter
        const selectedCat = categorySelect.value;
        if (selectedCat) {
          filtered = filtered.filter((p: any) => p.category === selectedCat);
        }

        // Sort
        const sortValue = sortSelect.value;
        if (sortValue === 'name-asc') {
          filtered.sort((a: any, b: any) => a.name.localeCompare(b.name));
        } else if (sortValue === 'name-desc') {
          filtered.sort((a: any, b: any) => b.name.localeCompare(a.name));
        } else if (sortValue === 'price-low') {
          filtered.sort((a: any, b: any) => a.price - b.price);
        } else if (sortValue === 'price-high') {
          filtered.sort((a: any, b: any) => b.price - a.price);
        }

        renderProducts(filtered);
      };

      searchInput.addEventListener('input', filterAndRender);
      sortSelect.addEventListener('change', filterAndRender);
      categorySelect.addEventListener('change', filterAndRender);

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        sortSelect.value = 'name-asc';
        categorySelect.value = '';
        renderProducts(allProducts);
      });
    }

    // Logout
    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      await client.auth.signOut();
      window.location.href = 'index.html';
    });

    loadDashboard();
  </script>
</body>
</html>
