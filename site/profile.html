<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Teststand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <!-- Header injected by js/header.js for consistency -->

  <main class="container">
    <section data-testid="profile-page">
      <h1 data-testid="profile-heading">Your profile</h1>

      <dl class="profile-details" data-testid="profile-details">
        <dt>Name</dt>
        <dd data-testid="profile-name" id="profile-name"></dd>
        <dt>Email</dt>
        <dd data-testid="profile-email" id="profile-email"></dd>
        <dt>Orders placed</dt>
        <dd data-testid="profile-order-count" id="profile-order-count"></dd>
      </dl>

      <!-- New: Edit profile -->
      <div data-testid="edit-profile-section" style="margin: 20px 0;">
        <h3>Edit Name</h3>
        <input type="text" id="edit-name" data-testid="edit-name-input" placeholder="New name">
        <button id="save-name-btn" data-testid="save-name-button">Save</button>
        <div id="edit-error" data-testid="edit-error" style="color:red; display:none;"></div>
      </div>

      <!-- New: Order history -->
      <div data-testid="order-history-section">
        <h3>Your Orders</h3>
        <div id="orders-list" data-testid="orders-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- New: My Reviews -->
      <div data-testid="my-reviews-section" style="margin-top: 1.5rem;">
        <h3>My Reviews</h3>
        <div id="my-reviews-list" data-testid="my-reviews-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <button id="logout-btn" class="btn-danger" data-testid="logout-submit">Log out</button>
    </section>
  </main>

  <script>
    const client = window.createSupabaseClient();

    async function loadProfile() {
      const user = await window.requireAuth(client);
      if (!user) return;

      document.getElementById('profile-email').textContent = user.email;

      const { data: { user: fresh } } = await client.auth.getUser();
      document.getElementById('profile-name').textContent = fresh?.user_metadata?.name || '—';
      document.getElementById('edit-name').value = fresh?.user_metadata?.name || '';

      // Count orders
      const { count } = await client
        .from('orders')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', user.id);

      document.getElementById('profile-order-count').textContent = count || 0;

      // Load order history (new)
      await loadOrderHistory(user.id);
      await loadMyReviews(user.id);
    }

    async function loadMyReviews(userId) {
      const { data: reviews, error } = await client
        .from('reviews')
        .select(`
          id, 
          rating, 
          comment, 
          created_at,
          products (name)
        `)
        .eq('user_id', userId)
        .order('created_at', { ascending: false })
        .limit(5);

      const container = document.getElementById('my-reviews-list');
      if (!container) return;
      container.innerHTML = '';

      if (error || !reviews || reviews.length === 0) {
        container.innerHTML = '<p data-testid="no-my-reviews">You have not left any reviews yet.</p>';
        return;
      }

      reviews.forEach((r) => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.setAttribute('data-testid', `my-review-${r.id}`);
        div.innerHTML = `
          <strong>${r.products?.name || 'Unknown product'}</strong> — ${r.rating}/5
          <p>${r.comment || '(no comment)'}</p>
          <small>${new Date(r.created_at).toLocaleDateString()}</small>
        `;
        container.appendChild(div);
      });
    }

    async function loadOrderHistory(userId) {
      const { data: orders, error } = await client
        .from('orders')
        .select(`
          id, 
          order_number, 
          total, 
          created_at,
          order_items (
            quantity, 
            price,
            products (name)
          )
        `)
        .eq('user_id', userId)
        .order('created_at', { ascending: false })
        .limit(5);

      const container = document.getElementById('orders-list');
      container.innerHTML = '';

      if (error || !orders || orders.length === 0) {
        container.innerHTML = '<p data-testid="no-orders">No orders yet.</p>';
        return;
      }

      orders.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.setAttribute('data-testid', `order-${order.id}`);

        let itemsHtml = '<ul>';
        order.order_items.forEach(item => {
          itemsHtml += `<li>${item.products?.name} x${item.quantity} — $${item.price}</li>`;
        });
        itemsHtml += '</ul>';

        div.innerHTML = `
          <strong data-testid="order-number-${order.id}">${order.order_number}</strong>
          <span> — $${order.total} on ${new Date(order.created_at).toLocaleDateString()}</span>
          ${itemsHtml}
        `;
        container.appendChild(div);
      });
    }

    // New: Edit name
    document.getElementById('save-name-btn')?.addEventListener('click', async () => {
      const newName = document.getElementById('edit-name').value.trim();
      const errorEl = document.getElementById('edit-error');
      errorEl.style.display = 'none';

      if (!newName) {
        errorEl.textContent = 'Name cannot be empty';
        errorEl.style.display = 'block';
        return;
      }

      const { error } = await client.auth.updateUser({
        data: { name: newName }
      });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      } else {
        document.getElementById('profile-name').textContent = newName;
        alert('Name updated!');
      }
    });

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      await client.auth.signOut();
      window.location.href = 'index.html';
    });

    loadProfile();
  </script>
</body>
</html>
