<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success — Teststand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="header" data-testid="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo" data-testid="site-logo">Teststand</a>
    </div>
  </header>

  <main class="container">
    <section class="success-card" data-testid="success-page">
      <h1 data-testid="success-heading">Order placed successfully!</h1>
      <p data-testid="success-message">Thank you for your order.</p>
      <p class="order-number" data-testid="order-number">Order number: <strong id="order-num"></strong></p>
      <a href="dashboard.html" class="btn" data-testid="success-continue">Continue shopping</a>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const client = window.createSupabaseClient();

    (async () => {
      await window.requireAuth(client); // optional, just to ensure logged in

      const params = new URLSearchParams(window.location.search);
      const orderNumber = params.get('order_number') || 'N/A';
      document.getElementById('order-num').textContent = orderNumber;
    })();
  </script>
</body>
</html>
