<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item — Teststand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <header class="header" data-testid="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo" data-testid="site-logo">Teststand</a>
      <nav class="nav" data-testid="main-nav">
        <a href="dashboard.html" data-testid="nav-dashboard">Dashboard</a>
        <a href="cart.html" data-testid="nav-cart">Cart</a>
        <a href="profile.html" data-testid="nav-profile">Profile</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section data-testid="item-detail-page">
      <div id="item-content">
        <!-- JS populates this -->
      </div>

      <form id="add-to-cart-form" style="margin-top: 1.5rem;" data-testid="add-to-cart-form">
        <label>Quantity
          <input type="number" id="quantity" value="1" min="1" data-testid="quantity-input">
        </label>
        <button type="submit" data-testid="add-to-cart-submit">Add to cart</button>
      </form>

      <!-- New: Reviews section for expanded UI test coverage -->
      <div id="reviews-section" style="margin-top: 2rem;" data-testid="reviews-section">
        <h3 data-testid="reviews-heading">Reviews</h3>
        <div id="reviews-list" data-testid="reviews-list"></div>

        <div id="add-review-form" style="margin-top: 1rem;" data-testid="add-review-form">
          <h4>Add your review</h4>
          <select id="review-rating" data-testid="review-rating">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Terrible</option>
          </select>
          <textarea id="review-comment" placeholder="Your comment (optional)" data-testid="review-comment" style="width:100%; height:60px;"></textarea>
          <button id="submit-review-btn" data-testid="submit-review-button">Submit Review</button>
        </div>
      </div>

      <div id="error-message" data-testid="error-message" style="display:none;"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const client = window.createSupabaseClient();

    async function loadItem() {
      const user = await window.requireAuth(client);
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        window.location.href = 'dashboard.html';
        return;
      }

      const { data: product, error } = await client
        .from('products')
        .select('*')
        .eq('id', id)
        .single();

      const container = document.getElementById('item-content');

      if (error || !product) {
        container.innerHTML = `<p>Product not found.</p>`;
        return;
      }

      container.innerHTML = `
        <h1 data-testid="item-name">${product.name}</h1>
        <p class="price" data-testid="item-price">$${product.price.toFixed(2)}</p>
        <p data-testid="item-description">${product.description}</p>
        <a href="dashboard.html" data-testid="back-link">← Back to catalog</a>
      `;
    }

    document.getElementById('add-to-cart-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = await window.requireAuth(client);
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const productId = parseInt(params.get('id'));
      const quantity = parseInt(document.getElementById('quantity').value) || 1;

      const { error } = await client
        .from('cart_items')
        .upsert({ 
          user_id: user.id, 
          product_id: productId, 
          quantity 
        }, { 
          onConflict: 'user_id,product_id' 
        });

      if (error) {
        window.showError('Failed to add to cart: ' + error.message);
      } else {
        window.location.href = 'cart.html';
      }
    });

    // New: Reviews functionality
    async function loadReviews(productId) {
      const { data: reviews, error } = await client
        .from('reviews')
        .select('*')
        .eq('product_id', productId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('reviews-list');
      list.innerHTML = '';

      if (error || !reviews || reviews.length === 0) {
        list.innerHTML = '<p data-testid="no-reviews">No reviews yet. Be the first!</p>';
        return;
      }

      reviews.forEach(r => {
        const div = document.createElement('div');
        div.setAttribute('data-testid', `review-${r.id}`);
        div.innerHTML = `
          <strong>Rating: ${r.rating}/5</strong>
          <p data-testid="review-comment-${r.id}">${r.comment || '(no comment)'}</p>
          <small>by ${r.user_id.slice(0,8)}... on ${new Date(r.created_at).toLocaleDateString()}</small>
        `;
        list.appendChild(div);
      });
    }

    async function submitReview(productId) {
      const user = await window.requireAuth(client);
      if (!user) return;

      const rating = parseInt(document.getElementById('review-rating').value);
      const comment = document.getElementById('review-comment').value.trim();

      const btn = document.getElementById('submit-review-btn');
      window.setLoading(btn, true, 'Submit Review');

      const { error } = await client.from('reviews').insert({
        product_id: productId,
        user_id: user.id,
        rating,
        comment: comment || null
      });

      window.setLoading(btn, false);

      if (error) {
        window.showError('Failed to submit review: ' + error.message);
      } else {
        document.getElementById('review-comment').value = '';
        await loadReviews(productId);
        window.hideError();
      }
    }

    // Load reviews after product
    const originalLoadItem = loadItem;
    window.loadItem = async function() {
      await originalLoadItem();
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      if (id) {
        await loadReviews(id);

        // Attach review submit
        const reviewBtn = document.getElementById('submit-review-btn');
        if (reviewBtn) {
          reviewBtn.onclick = () => submitReview(id);
        }
      }
    };

    loadItem();
  </script>
</body>
</html>
