<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — QA Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/products.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/supabase-data.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/layout.js"></script>
<script src="js/store.js"></script>
</head>
<body>

<div id="app-root"></div>

<script>
window.initAuthenticatedPage('item', 'Товар', async ({ client, user, currentUser }) => {
  await window.syncStoreFromDB(client, user.id);

  const main = document.getElementById('main-content');

    const params = new URLSearchParams(location.search);
    const id = parseInt(params.get('id'));
    if (!id) {
      main.innerHTML = '<p>Товар не найден</p>';
      return;
    }

    const products = await window.loadProducts(client);
    const product = products.find(p => p.id == id);
    if (!product) {
      main.innerHTML = '<p>Товар не найден</p>';
      return;
    }

    main.innerHTML = `
      <div class="page-head">
        <div>
          <span class="page-eyebrow">Товар</span>
          <h1 class="page-title" data-testid="item-name">${product.name}</h1>
        </div>
      </div>
      <div class="product-thumb" style="width:60px;height:60px;margin-bottom:8px;">${window.productIcon(product.img || 'keyboard', 60)}</div>
      <p class="price" data-testid="item-price">${window.formatPrice(product.price)}</p>
      <p data-testid="item-description">${product.description || ''}</p>

      <form id="add-to-cart-form" data-testid="add-to-cart-form" style="margin-top:1rem;">
        <input type="number" id="quantity" value="1" min="1" data-testid="add-to-cart-quantity" style="width:60px;">
        <button type="submit" class="btn btn-primary" data-testid="add-to-cart-submit">Добавить в корзину</button>
      </form>

      <div id="reviews-section" style="margin-top:2rem;" data-testid="reviews-section">
        <h3 data-testid="reviews-heading">Отзывы</h3>
        <div id="reviews-list" data-testid="reviews-list"></div>
        <div id="add-review-form" style="margin-top:1rem;" data-testid="add-review-form">
          <h4>Оставить отзыв</h4>
          <select id="review-rating" data-testid="review-rating">
            <option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option>
          </select>
          <textarea id="review-comment" placeholder="Комментарий" data-testid="review-comment" style="width:100%;height:60px;"></textarea>
          <button id="submit-review-btn" class="btn btn-accent" data-testid="submit-review-button">Отправить</button>
        </div>
      </div>

      <a href="catalog.html" data-testid="back-link">← Назад в каталог</a>
    `;

    document.getElementById('add-to-cart-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const qty = parseInt(document.getElementById('quantity').value) || 1;
      await window.addToCartDB(client, user.id, id, qty);
      await window.syncStoreFromDB(client, user.id);
      window.location.href = 'cart.html';
    });

    async function loadReviews() {
      const revs = await window.loadReviews(client, id);
      const list = document.getElementById('reviews-list');
      list.innerHTML = (revs && revs.length) ? revs.map(r => `
        <div data-testid="review-${r.id}">
          <strong>Rating: ${r.rating}/5</strong>
          <p data-testid="review-comment-${r.id}">${r.comment || ''}</p>
        </div>
      `).join('') : '<p data-testid="no-reviews">Отзывов пока нет. Будьте первым!</p>';
    }
    loadReviews();

    document.getElementById('submit-review-btn').onclick = async () => {
      const rating = parseInt(document.getElementById('review-rating').value);
      const comment = document.getElementById('review-comment').value.trim();
      const ok = await window.addReviewDB(client, user.id, id, rating, comment);
      if (ok) {
        document.getElementById('review-comment').value = '';
        if (window.showToast) window.showToast('Отзыв отправлен', 'success');
        loadReviews();
      } else {
        if (window.showToast) window.showToast('Ошибка отправки отзыва', 'error');
      }
    };
  });
</script>
</body>
</html>
