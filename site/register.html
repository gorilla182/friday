<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — QA Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 1px); background-size:28px 28px; padding:var(--sp-5); }
  .auth-card { width:100%; max-width:400px; padding:var(--sp-7) var(--sp-6); box-shadow:var(--shadow-md); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
</head>
<body>
<div class="card auth-card" data-testid="register-card">
  <div class="auth-brand">
    <div class="brand-mark"></div>
    <span class="auth-brand-name">QA<span>Store</span></span>
  </div>
  <div class="auth-heading">
    <h1>Регистрация</h1>
  </div>
  <form class="auth-form" id="register-form" data-testid="register-form">
    <div class="field">
      <label class="field-label">Имя</label>
      <input class="field-input" id="name" data-testid="register-name-input" required>
    </div>
    <div class="field">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" id="email" data-testid="register-email-input" required>
    </div>
    <div class="field">
      <label class="field-label">Пароль</label>
      <input class="field-input" type="password" id="password" data-testid="register-password-input" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-accent btn-block" data-testid="register-submit-button">Зарегистрироваться</button>
  </form>
  <div class="auth-foot">
    Уже есть аккаунт? <a href="index.html" class="auth-link" data-testid="go-to-login-link">Войти</a>
  </div>
</div>
<script>
  const client = window.createSupabaseClient();
  const form = document.getElementById('register-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const name = document.getElementById('name').value;
      const { error } = await client.auth.signUp({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        options: { data: { name } }
      });
      if (error) {
        alert(error.message);
      } else {
        alert('Регистрация успешна. Проверьте почту если требуется.');
        window.location.href = 'index.html';
      }
    } catch (e) {
      alert('Error: ' + e.message);
    }
  });
</script>
</body>
</html>
