<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Teststand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/header.js"></script>
</head>
<body>
  <!-- Header injected by js/header.js -->

  <main class="container">
    <section data-testid="register-page">
      <h1 data-testid="register-heading">Create account</h1>
      
      <form id="register-form" data-testid="register-form">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" value="Test User" data-testid="register-name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" value="newuser@example.com" data-testid="register-email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" value="password123" data-testid="register-password" required minlength="6">
        </div>
        <div>
          <label for="password_confirm">Confirm password</label>
          <input type="password" id="password_confirm" value="password123" data-testid="register-password-confirm" required>
        </div>

        <button type="submit" data-testid="register-submit">Register</button>
      </form>

      <p style="margin-top: 1rem;">
        Already have an account? <a href="index.html" data-testid="login-link">Log in</a>
      </p>

      <div id="error-message" class="error-message" data-testid="error-message" style="display:none;"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="js/header.js"></script>
  <script>
    const client = window.createSupabaseClient();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password_confirm').value;
      const errorEl = document.getElementById('error-message');

      errorEl.style.display = 'none';

      if (password !== passwordConfirm) {
        window.showError('Passwords do not match.');
        return;
      }

      if (password.length < 6) {
        window.showError('Password must be at least 6 characters.');
        return;
      }

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { name }
        }
      });

      if (error) {
        window.showError(error.message);
        return;
      }

      // In Supabase, email confirmation may be required by default.
      // For the teststand we can disable email confirmation in dashboard settings.
      alert('Registration successful! Please check your email or log in (if confirmation is disabled).');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
