<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teststand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <header class="header" data-testid="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" data-testid="site-logo">Teststand</a>
    </div>
  </header>

  <main class="container">
    <section data-testid="login-page">
      <h1 data-testid="login-heading">Log in</h1>
      
      <form id="login-form" data-testid="login-form">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" value="alice@example.com" data-testid="login-email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" value="password123" data-testid="login-password" required>
        </div>
        
        <button type="submit" data-testid="login-submit">Log in</button>
      </form>

      <p style="margin-top: 1rem;">
        Don't have an account? <a href="register.html" data-testid="register-link">Register</a>
      </p>

      <div id="error-message" class="error-message" data-testid="error-message" style="display:none;"></div>
    </section>
  </main>

  <footer class="footer" data-testid="site-footer">
    <div class="container">
      <p>Teststand — training app for automated testing</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    const client = window.createSupabaseClient();
    const form = document.getElementById('login-form');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      window.hideError();

      window.setLoading(submitBtn, true, 'Log in');

      try {
        const { error } = await client.auth.signInWithPassword({ email, password });

        window.setLoading(submitBtn, false);

        if (error) {
          window.showError(error.message || 'Invalid email or password.');
          return;
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        window.setLoading(submitBtn, false);
        window.showError('Login failed: ' + (err.message || err));
      }
    });

    // Auto-redirect if already logged in
    (async () => {
      const { data: { user } } = await client.auth.getUser();
      if (user) {
        window.location.href = 'dashboard.html';
      }
    })();
  </script>
</body>
</html>
