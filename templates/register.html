{% extends "base.html" %}

{% block title %}Register — Teststand{% endblock %}

{% block content %}
<section class="auth-card" data-testid="register-page">
    <h1 data-testid="register-heading">Create account</h1>

    {% if error %}
    <div class="error-box" data-testid="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('ui.register') }}" data-testid="register-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ name }}"
               required data-testid="register-name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}"
               required data-testid="register-email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required data-testid="register-password">

        <label for="password_confirm">Confirm password</label>
        <input type="password" id="password_confirm" name="password_confirm"
               required data-testid="register-password-confirm">

        <button type="submit" data-testid="register-submit">Register</button>
    </form>

    <p class="auth-link">
        Already have an account?
        <a href="{{ url_for('ui.login') }}" data-testid="register-login-link">Sign in</a>
    </p>
</section>
{% endblock %}
