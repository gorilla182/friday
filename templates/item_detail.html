{% extends "base.html" %}

{% block title %}{{ product.name }} — Teststand{% endblock %}

{% block content %}
<section data-testid="item-detail-page">
    <a href="{{ url_for('ui.dashboard') }}" class="back-link" data-testid="back-to-dashboard">&larr; Back to catalog</a>

    <article class="item-detail" data-testid="item-detail-{{ product.id }}">
        <h1 data-testid="item-name">{{ product.name }}</h1>
        <p class="price" data-testid="item-price">${{ "%.2f"|format(product.price) }}</p>
        <p class="description" data-testid="item-description">{{ product.description }}</p>

        <form method="post" action="{{ url_for('ui.add_to_cart', item_id=product.id) }}"
              data-testid="add-to-cart-form">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1"
                   data-testid="add-to-cart-quantity">
            <button type="submit" data-testid="add-to-cart-submit">Add to cart</button>
        </form>
    </article>
</section>
{% endblock %}
